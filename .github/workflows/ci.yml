name: Local Ops CI Lab

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: localops-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-integration-browser-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout tested PR integration subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Report actual checkout source identity
        run: |
          git rev-parse HEAD
          python --version
          git status --short

      - name: Install pinned synthetic browser verifier
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Run identical local and CI verification contract
        run: python tools/verify.py --browser

  windows-private-config-ntfs-acl:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout tested PR integration subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify actual Windows source and execute private-config T1-T6
        shell: pwsh
        run: |
          git rev-parse HEAD
          python --version
          python -m unittest discover -s tests -p test_delivery.py -k PrivateConfigurationSecurityContract -v
